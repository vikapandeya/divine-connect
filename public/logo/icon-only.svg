<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="72%">
      <stop offset="0%"   stop-color="#FCD34D"/>
      <stop offset="48%"  stop-color="#F97316"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <radialGradient id="cg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Saffron-gold background -->
  <rect width="200" height="200" rx="42" fill="url(#bg)"/>
  <!-- Subtle inner glow -->
  <circle cx="100" cy="100" r="72" fill="url(#cg)"/>

  <!-- 8 lotus petals — wider & more opaque so they read at small sizes -->
  <g fill="white" opacity="0.52">
    <path d="M100,99 Q77,72 100,43 Q123,72 100,99Z" transform="rotate(0   100 100)"/>
    <path d="M100,99 Q77,72 100,43 Q123,72 100,99Z" transform="rotate(45  100 100)"/>
    <path d="M100,99 Q77,72 100,43 Q123,72 100,99Z" transform="rotate(90  100 100)"/>
    <path d="M100,99 Q77,72 100,43 Q123,72 100,99Z" transform="rotate(135 100 100)"/>
    <path d="M100,99 Q77,72 100,43 Q123,72 100,99Z" transform="rotate(180 100 100)"/>
    <path d="M100,99 Q77,72 100,43 Q123,72 100,99Z" transform="rotate(225 100 100)"/>
    <path d="M100,99 Q77,72 100,43 Q123,72 100,99Z" transform="rotate(270 100 100)"/>
    <path d="M100,99 Q77,72 100,43 Q123,72 100,99Z" transform="rotate(315 100 100)"/>
  </g>

  <!-- Dark centre so the OM has good contrast -->
  <circle cx="100" cy="100" r="44" fill="rgba(0,0,0,0.20)"/>
  <circle cx="100" cy="100" r="38" fill="rgba(0,0,0,0.10)"/>

  <!-- OM — large, bold, primary element -->
  <text x="100" y="125"
        text-anchor="middle"
        fill="white"
        font-family="'Noto Serif Devanagari','Noto Sans Devanagari',serif"
        font-size="72"
        font-weight="700">ॐ</text>
</svg>
