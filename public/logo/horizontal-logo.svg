<svg width="360" height="90" viewBox="0 0 360 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgH" cx="38%" cy="30%" r="72%">
      <stop offset="0%"   stop-color="#FCD34D"/>
      <stop offset="48%"  stop-color="#F97316"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <radialGradient id="cgH" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Icon background square -->
  <rect x="5" y="5" width="80" height="80" rx="18" fill="url(#bgH)"/>

  <!-- Icon center radiance -->
  <circle cx="45" cy="45" r="33" fill="url(#cgH)"/>

  <!-- Outer guide ring -->
  <circle cx="45" cy="45" r="24" fill="none" stroke="white"
          stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- 8 outer petals (scaled: icon 80px wide, center at 45,45) -->
  <g fill="white" opacity="0.38">
    <path d="M45,44.5 Q37.5,33.5 45,22 Q52.5,33.5 45,44.5Z" transform="rotate(0   45 45)"/>
    <path d="M45,44.5 Q37.5,33.5 45,22 Q52.5,33.5 45,44.5Z" transform="rotate(45  45 45)"/>
    <path d="M45,44.5 Q37.5,33.5 45,22 Q52.5,33.5 45,44.5Z" transform="rotate(90  45 45)"/>
    <path d="M45,44.5 Q37.5,33.5 45,22 Q52.5,33.5 45,44.5Z" transform="rotate(135 45 45)"/>
    <path d="M45,44.5 Q37.5,33.5 45,22 Q52.5,33.5 45,44.5Z" transform="rotate(180 45 45)"/>
    <path d="M45,44.5 Q37.5,33.5 45,22 Q52.5,33.5 45,44.5Z" transform="rotate(225 45 45)"/>
    <path d="M45,44.5 Q37.5,33.5 45,22 Q52.5,33.5 45,44.5Z" transform="rotate(270 45 45)"/>
    <path d="M45,44.5 Q37.5,33.5 45,22 Q52.5,33.5 45,44.5Z" transform="rotate(315 45 45)"/>
  </g>

  <!-- 8 inner petals -->
  <g fill="white" opacity="0.72">
    <path d="M45,44.5 Q39,36 45,27.5 Q51,36 45,44.5Z" transform="rotate(22.5  45 45)"/>
    <path d="M45,44.5 Q39,36 45,27.5 Q51,36 45,44.5Z" transform="rotate(67.5  45 45)"/>
    <path d="M45,44.5 Q39,36 45,27.5 Q51,36 45,44.5Z" transform="rotate(112.5 45 45)"/>
    <path d="M45,44.5 Q39,36 45,27.5 Q51,36 45,44.5Z" transform="rotate(157.5 45 45)"/>
    <path d="M45,44.5 Q39,36 45,27.5 Q51,36 45,44.5Z" transform="rotate(202.5 45 45)"/>
    <path d="M45,44.5 Q39,36 45,27.5 Q51,36 45,44.5Z" transform="rotate(247.5 45 45)"/>
    <path d="M45,44.5 Q39,36 45,27.5 Q51,36 45,44.5Z" transform="rotate(292.5 45 45)"/>
    <path d="M45,44.5 Q39,36 45,27.5 Q51,36 45,44.5Z" transform="rotate(337.5 45 45)"/>
  </g>

  <!-- Central circle -->
  <circle cx="45" cy="45" r="11" fill="white" opacity="0.18"/>
  <circle cx="45" cy="45" r="8.5" fill="white" opacity="0.16"/>

  <!-- OM symbol (icon) -->
  <text x="45" y="52"
        text-anchor="middle"
        fill="white"
        font-family="'Noto Serif Devanagari','Noto Sans Devanagari',serif"
        font-size="17"
        font-weight="700">ॐ</text>

  <!-- Vertical separator -->
  <line x1="104" y1="18" x2="104" y2="72"
        stroke="#F97316" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Brand name -->
  <text x="118" y="50"
        fill="#1C1917"
        font-family="'Cinzel Decorative','Cinzel','Trajan Pro','Times New Roman',serif"
        font-size="28"
        font-weight="700"
        letter-spacing="0.3">PunyaSeva</text>

  <!-- Tagline -->
  <text x="118" y="68"
        fill="#92400E"
        font-family="'Cormorant Garamond','Garamond','Georgia',serif"
        font-size="11"
        font-style="italic"
        letter-spacing="1.5">Seva · Shakti · Sanatan</text>
</svg>
